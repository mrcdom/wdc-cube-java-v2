# On every push and pull request to main: the whole Maven build with its tests, the frontends' own tests, the four web
# frontends, and the compose setup with two instances checked from outside (check.py).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAVEN_ARGS: -B -ntp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          # no npm cache: the repository keeps no package-lock.json
          node-version: "24"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      # the reactor builds the Flutter desktop app for this platform (Linux: GTK, and libsecret for its secure storage)
      # and the SWT views; xvfb gives SWT a display
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev xvfb

      - name: Maven build and tests
        working-directory: fontes
        run: xvfb-run -a mvn clean install

      - name: React tests
        working-directory: fontes/br.com.wdc.store/br.com.wdc.store.view.remote/remote.shell.react
        run: npm test

      - name: React bridge tests
        working-directory: fontes/br.com.wdc.framework/br.com.wdc.framework.cube.remote/remote.bridge.react
        run: npm test

      - name: Flutter tests
        working-directory: fontes/br.com.wdc.store/br.com.wdc.store.view.remote/remote.shell.flutter/flutter.commons
        run: flutter test

      # Codename One's CSS compiler draws in an AWT window: xvfb gives it a display
      - name: Codename One tests
        working-directory: fontes/br.com.wdc.store/br.com.wdc.store.view.remote/remote.shell.cn1
        run: xvfb-run -a ./mvnw test -pl common,javase

      # the modules were just installed: the TeaVM targets compile against them
      - name: Web frontends
        run: JAVA25_HOME="$JAVA_HOME" ./work/bin/build-frontends.sh --skip-install

      - name: Docker build context
        run: fontes/br.com.wdc.store/br.com.wdc.store.docker/prepare.sh --skip-build

      - uses: actions/upload-artifact@v4
        with:
          name: docker-context
          path: fontes/br.com.wdc.store/br.com.wdc.store.docker/build/context
          retention-days: 3

  compose:
    name: Two instances (compose)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fontes/br.com.wdc.store/br.com.wdc.store.docker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-context
          path: fontes/br.com.wdc.store/br.com.wdc.store.docker/build/context

      # fresh secrets for this run only
      - name: Secrets
        run: |
          {
            echo "STORE_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "STORE_JWT_SECRET=$(openssl rand -hex 32)"
            echo "STORE_MANAGEMENT_TOKEN=$(openssl rand -hex 24)"
            echo "STORE_REMOTE_SIGNING_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
          } > .env

      # the bundle of web components a local build puts in the web cache is not in the repository: the image gets an
      # empty web cache (an artifact drops empty folders)
      - name: Web cache
        run: mkdir -p build/context/web-cache

      - name: Start
        run: docker compose up -d --build --wait

      - name: Check
        run: python3 check.py

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v
