# =============================================================================
# WDC Store - Application Configuration
# =============================================================================
# Lives at <work directory>/config/application.toml; the module's work/ folder is its work directory in development:
# start with --workdir=work (or STORE_WORKDIR). Its subfolders: config/, data/, log/, temp/.

# ---------------------------------------------------------------------------
# Database (H2)
# ---------------------------------------------------------------------------
[database]
# JDBC URL (default: h2 file in data dir)
# url = "jdbc:h2:file:./work/data/wedocode-store"
username = "sa"
password = "sa"
# Drop and recreate tables on startup
reset = false

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
[security.jwt]
# Secret key for JWT token signing (leave empty to auto-generate)
# secret = ""

# ---------------------------------------------------------------------------
# Server (Vaadin / React)
# ---------------------------------------------------------------------------
[server]
port = 8090

# ---------------------------------------------------------------------------
# Development
# ---------------------------------------------------------------------------
[dev]
# Enables dev tools (e.g. click logo to rebuild all Swing views)
mode = true
