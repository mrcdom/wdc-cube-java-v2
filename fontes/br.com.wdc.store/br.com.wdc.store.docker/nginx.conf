# The two backend instances behind one address (docs/running-several-instances.md):
# - a browser tab's WebSocket stays on one instance: hashed on the session id in its path
#   (/dispatcher/<id>, or /<frontend>/dispatcher/<id>);
# - an API client with a remote transaction stays on one instance: hashed on X-Client-Id;
# - /api/auth is limited per client address here, for every instance together (the backends' own limit is off).
map $uri $affinity_from_path {
    ~^(/[^/]+)?/dispatcher/(?<sid>[^/]+)$  $sid;
    default                                 "";
}
map $affinity_from_path $affinity {
    ""       $http_x_client_id;
    default  $affinity_from_path;
}
map $http_upgrade $connection_upgrade {
    default  upgrade;
    ""       close;
}

limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;

upstream store {
    hash $affinity consistent;
    server store-a:8080;
    server store-b:8080;
}

server {
    listen 8080;

    # every location inherits these only while it sets none of its own: they are all here. Host is the address the
    # browser used, which the backend takes as its own origin.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location ~ ^(/[^/]+)?/api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://store;
    }

    location / {
        proxy_pass http://store;
        proxy_read_timeout 300s;
    }
}
