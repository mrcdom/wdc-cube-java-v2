# Scrapes each backend instance's /metrics, with the management token (a compose secret).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: wdc-store
    authorization:
      type: Bearer
      credentials_file: /run/secrets/management_token
    static_configs:
      - targets: ["store-a:8080", "store-b:8080"]
