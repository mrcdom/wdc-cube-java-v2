# WDC Store - Application Configuration
# Lives at <work directory>/config/application.toml. The hosts (backend, Vaadin, SWT) take the work directory from
# --workdir=<folder> or STORE_WORKDIR; work/bin/start-server.sh passes the repository's work/ folder.
# Its subfolders: config/, data/, log/, temp/ and frontend/.

[database]
# JDBC URL. Default: H2 file database in the data directory
# url = "jdbc:h2:file:/path/to/wedocode-store;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"

# H2 TCP server mode (for memory measurements — isolates DB heap from app heap):
# 1. Start: ./work/bin/start-h2-server.sh
# 2. Uncomment the line below, comment out the file URL above
# url = "jdbc:h2:tcp://localhost/./wedocode-store;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
# Database credentials (H2 defaults)
# username = "sa"
# password = "sa"

# PostgreSQL (recommended for production and load testing beyond H2 limits):
# url = "jdbc:h2:tcp://localhost/./wedocode-store;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
# url = "jdbc:postgresql://localhost:5432/wedocode-store"
# username = "postgres"
# password = "admin"

url = "jdbc:h2:tcp://localhost/./wedocode-store;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
# url = "jdbc:postgresql://localhost:5432/wedocode-store"
# username = "postgres"
# password = "changeme"


# Reset database on startup (clears all rows and seeds the sample data again)
# reset = false

# Transaction mode:
#   "jta"     = Narayana TransactionManager + Agroal pool enlisted in XA
#   "non-jta" = plain JDBC (autocommit per statement) — default
transaction = "jta"

# Log SQL statements executed by jOOQ (true/false)
logSql = false

# Connection pool (Agroal)
# maxSize             = maximum concurrent connections to the database
# minIdle             = minimum connections kept alive in the pool
# connectionTimeoutSeconds = max wait for a connection before throwing
#
# H2 TCP: the H2 server (2.x) does not impose a fixed connection limit —
#   it spawns one thread per connection internally. The effective limit is
#   the OS thread/socket capacity of the H2 process.
#   H2 serializes writes with a single database-level lock; gains above
#   ~100–200 connections are marginal for write-heavy loads.
#   For read-heavy loads (navigation/queries), large pools help significantly.
#
# PostgreSQL: maxSize can safely match or exceed the number of concurrent sessions.
#
# pool.maxSize = 20
# pool.minIdle = 5
# pool.connectionTimeoutSeconds = 30
pool.maxSize = 100
pool.minIdle = 20

# Client-driven remote transaction (REST coordinator). Durations in seconds / counts.
# Missing keys → RemoteTransactionCoordinatorImpl defaults (shown below).
# remoteTransaction.idleTimeoutSeconds = 60       # idle time before the reaper rolls the tx back
# remoteTransaction.maxLifetimeSeconds = 600      # absolute lifetime (even while active)
# remoteTransaction.outcomeRetentionSeconds = 300 # commit/rollback idempotency window
# remoteTransaction.maxOpen = 128                 # global cap on open txs (protects the pool)
# remoteTransaction.maxOpenPerOwner = 16          # per-owner cap

[server]
# HTTP port
# port = 8080

# Development mode: enables live-reload endpoints (/__dev/ws, /__dev/notify)
devMode = true

# CORS — control of the cross-origin origins the server accepts.
# allowAll = true reflects any origin (development only).
# When false, only the origins in allowedHosts are accepted.
cors.allowAll = true
# Allowlist used when allowAll = false (comma-separated).
# If absent/empty, uses the built-in default (Tauri desktop, Android WebView, local dev).
# cors.allowedHosts = "http://localhost:8080, http://store-wdc.localhost:8080, tauri://localhost, https://tauri.localhost, http://tauri.localhost"
# Allows cross-origin cookies/authentication headers (default: true).
cors.allowCredentials = true

# Maximum number of concurrent application sessions (Host/Shell protocol).
# Connections beyond this limit are rejected with HTTP 503 (session/init)
# or WebSocket close code 4003 (browser clients).
# Omit or set to -1 for unlimited (default).
# maxSessions = 100

# TTL (seconds) for authenticated sessions after WebSocket disconnect.
# The session stays in memory so the user can reconnect without losing state.
#   -1 or omitted = default (180s / 3 min) — recommended for production
#        0        = disable cache; session released immediately on disconnect
#                   (recommended for load tests — avoids zombie session accumulation)
#   any positive  = custom TTL in seconds
sessionTtlSeconds = 0

[security]
# JWT secret for API authentication (RepositoryApiRoutes)
# If not set, API endpoints are served without authentication
jwt.secret = "wdc-store-jwt-s3cr3t-k3y-ch4ng3-1n-pr0duct10n"
# Requests to /api/auth (challenge, login, refresh) per client address and minute; 0 = no limit (default: 60).
# Behind a proxy every client is the proxy's address: limit per address at the proxy instead.
# auth.requestsPerMinute = 60

[management]
# Token that GET /metrics (Prometheus format) asks for, as "Authorization: Bearer <token>". Without it, the route does
# not exist. Keep it in application.local.toml; over a network that is not private, serve behind TLS.
# token = "<random secret>"

[remote]
# HMAC-SHA256 key that signs the remote session ids and the addresses of the history (Base64 URL-safe, >= 32 bytes).
# When absent, a random one is generated on the first start and written to application.local.toml.
# Instances that must accept each other's sessions share the same key. The channel keys are agreed per connection.
# signingKey = "<base64url>"

[simulation]
# Simulate slow login (adds 3s delay in LoginPresenter)
slowLogin = false
